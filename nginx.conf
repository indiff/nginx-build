
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;
	
	lua_package_path "/opt/nginx/lib/lua/?.lua;;";

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
	
	
	# /usr/bin/geoipupdate -f /opt/nginx/GeoIP.conf -d /opt/nginx/GeoIP
	geoip2 /opt/nginx/GeoIP/GeoLite2-Country.mmdb {
		auto_reload 60m;
		$geoip2_metadata_country_build metadata build_epoch;
		$geoip2_data_country_code source=$remote_addr country iso_code;
		$geoip2_data_country_name country names en;
	}

	# 加载 GeoLite2 城市级数据库
	geoip2 /opt/nginx/GeoIP/GeoLite2-City.mmdb {
		$geoip2_data_city_name city names en;
		$geoip2_data_latitude location latitude;
		$geoip2_data_longitude location longitude;
	}
	
	
	log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '"$geoip2_data_country_code" "$geoip2_data_city_name" "$geoip2_data_longitude" "$geoip2_data_latitude" '
                          'Body: "$request_body" ';  
	
	access_log  logs/access.log custom_log;
	error_log   logs/error.log ;
	vhost_traffic_status_zone;

	

    server {
        listen       80;
        server_name  localhost;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
